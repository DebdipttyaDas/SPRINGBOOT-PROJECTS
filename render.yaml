services:
  # Spring Boot Backend Web Service
  - type: web
    name: civic-eye-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:civicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
