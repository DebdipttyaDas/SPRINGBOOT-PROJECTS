# Server Port (Render dynamically assigns $PORT)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=civicai-backend

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Production Database Configuration with dynamic env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:civicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.civicai=INFO
logging.level.org.springframework.web=INFO
